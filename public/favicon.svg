<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HELIX AI">
  <defs>
    <linearGradient id="e" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A52"/>
      <stop offset="1" stop-color="#FF5C35"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#0C0B0A"/>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="13.75" fill="none" stroke="#EDEAE3" stroke-opacity="0.10" stroke-width="1.5"/>
